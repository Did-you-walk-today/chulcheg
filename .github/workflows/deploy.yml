name: Deploy to Cloudflare

# main 에 push 될 때마다: 원격 D1 마이그레이션 → opennext 빌드 → Cloudflare 배포.
# Windows 에서는 opennext 빌드가 안 되므로(세그폴트) 배포는 이 CI(Linux)에서만 수행한다.
# 필요 시 Actions 탭에서 수동 실행(workflow_dispatch)도 가능.

on:
  push:
    branches: [main]
  workflow_dispatch:

# 동시에 두 배포가 겹치지 않도록 직렬화.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 1) 코드보다 스키마가 먼저 준비되도록 원격 D1 마이그레이션을 먼저 적용.
      #    (추가형 마이그레이션이라 기존 코드도 안전)
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply chulcheg-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 2) opennext 빌드 + 배포.
      - name: Build & Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
